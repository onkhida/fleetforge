<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FleetForge CDMS</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#F0FDF4',
                            100: '#DCFCE7',
                            200: '#BBF7D0',
                            300: '#86EFAC',
                            400: '#4ADE80',
                            500: '#22C55E',
                            600: '#16A34A',
                            700: '#15803D',
                            800: '#166534',
                            900: '#14532D',
                            950: '#052E16',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-hidden">
    
    <!-- Background Decor (Clean, executive light green gradients) -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-brand-100/40 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-slate-200/50 rounded-full blur-3xl translate-x-1/2 translate-y-1/2"></div>

    <!-- Login Container -->
    <div class="w-full max-w-md z-10">
        
        <!-- FleetForge Centered Card -->
        <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-100/80">
            <!-- Branding -->
            <div class="text-center mb-8">
                <div class="inline-flex w-12 h-12 bg-brand-800 rounded-2xl items-center justify-center shadow-md shadow-brand-800/10 mb-4">
                    <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">FleetForge</h1>
                <p class="text-sm text-slate-500 mt-1.5">Enterprise Car Dealership Management System</p>
            </div>

            <!-- Django Error Alerts -->
            {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    {% if message.tags == 'error' %}
                    <div class="p-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-900 flex items-start space-x-3 text-sm font-medium">
                        <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600 shrink-0 mt-0.5"></i>
                        <div class="flex-1">
                            {{ message }}
                        </div>
                    </div>
                    {% endif %}
                {% endfor %}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="" class="space-y-5">
                {% csrf_token %}
                
                <!-- Email Address -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4.5 h-4.5 text-slate-400 absolute left-4 top-3.5"></i>
                        <input type="email" name="username" id="email" required placeholder="name@dealership.com"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-800 focus:border-transparent transition-all">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Password</label>
                        <a href="/auth/forgot-password/" class="text-xs font-medium text-brand-800 hover:text-brand-900">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4.5 h-4.5 text-slate-400 absolute left-4 top-3.5"></i>
                        <input type="password" name="password" id="password" required placeholder="Enter password"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-800 focus:border-transparent transition-all">
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center">
                    <input type="checkbox" name="remember_me" id="remember-me" 
                        class="h-4 w-4 rounded border-slate-300 text-brand-800 focus:ring-brand-800">
                    <label for="remember-me" class="ml-2.5 text-sm font-medium text-slate-600">Keep me logged in</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                    class="w-full py-3 bg-brand-800 text-white rounded-xl text-sm font-semibold hover:bg-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-800 focus:ring-offset-2 transition-all shadow-md shadow-brand-800/10 flex items-center justify-center space-x-2 mt-2">
                    <span>Sign In</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-400 mt-6 font-medium">
            Protected by FleetForge Security Console. Authorized use only.
        </p>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
